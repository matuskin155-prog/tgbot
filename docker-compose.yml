services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env.example оставляет BROWSER_EXECUTABLE_PATH пустым (это нормально
      # для деплоя без Docker — там его находит deploy.sh), но env_file выше
      # этой же пустой строкой перекрыл бы ENV из Dockerfile (там уже стоит
      # путь к браузеру, который сам ставится в образ). Эта строка так же,
      # как Dockerfile, возвращает путь по умолчанию, если в .env он пуст.
      - BROWSER_EXECUTABLE_PATH=${BROWSER_EXECUTABLE_PATH:-/usr/bin/chromium}
    volumes:
      - ./service_account.json:/app/service_account.json:ro
      - ./data:/app/data

  # Mini App — веб-интерфейс бота (см. README, раздел «Mini App»).
  # Нужен отдельный домен с HTTPS: поставьте свой реверс-прокси
  # (например Caddy) на хосте, указывающий на 127.0.0.1:8787.
  # Раскомментируйте, если настраиваете Mini App через Docker:
  # webapp:
  #   build: .
  #   command: python -m webapp.server
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     - BROWSER_EXECUTABLE_PATH=${BROWSER_EXECUTABLE_PATH:-/usr/bin/chromium}
  #   volumes:
  #     - ./service_account.json:/app/service_account.json:ro
  #     - ./data:/app/data
  #   ports:
  #     - "127.0.0.1:8787:8787"
