name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить pytest
        run: python -m pip install pytest
      - name: Проверить, что весь код компилируется
        run: python -m compileall -q bot webapp tests
      - name: Запустить тесты
        run: python -m pytest -v
